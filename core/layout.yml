# Bildschirmaufbau: Stile, Kopfzeile, Navigation, Seiten, Ruhemodus
#
# Kopfzeile und Leiste liegen auf dem top_layer und bleiben beim
# Seitenwechsel stehen. Die Kacheln hängen sich per `!extend` an die
# Seiten page_lights, page_covers und page_climate (siehe tiles/).

lvgl:
  log_level: NONE
  color_depth: 16

  displays:
    - tft_display
  touchscreens:
    - tft_touch

  theme:
    button:
      bg_color: 0x182031
      text_color: 0xEEF2F8
      shadow_width: 0
      border_width: 0

  style_definitions:
    - id: page_style
      bg_color: 0x141B2A
      bg_grad_color: 0x0A0E16
      bg_grad_dir: VER
      border_width: 0
      radius: 0
      pad_top: 64
      pad_bottom: 0
      pad_left: 14
      pad_right: 14
      pad_row: 10
      pad_column: 10
    - id: box
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
    - id: card
      bg_color: 0x182031
      bg_opa: COVER
      border_width: 1
      border_color: 0x2C3650
      radius: 20
      pad_all: 0
      shadow_width: 0
    - id: pill
      height: 32
      radius: 16
      bg_color: 0x182031
      border_width: 1
      border_color: 0x2C3650
      pad_top: 0
      pad_bottom: 0
      pad_left: 12
      pad_right: 14
      pad_column: 6
      text_color: 0xEEF2F8
      text_font: font_13
    - id: muted_caps
      text_font: font_12
      text_color: 0x8892A8
      text_letter_space: 1

  # ------------------------------------------------------------------
  # Immer sichtbar: Kopfzeile, Leiste; darüber Ruhemodus und Laden
  # ------------------------------------------------------------------
  top_layer:
    widgets:
      # --- Kopfzeile ---
      - obj:
          id: header
          x: 0
          y: 0
          width: 480
          height: 62
          styles: box
          clickable: false
          scrollable: false
          widgets:
            - obj:
                x: 18
                y: 11
                width: 40
                height: 40
                radius: 14
                bg_color: 0x2A3350
                bg_grad_color: 0x1C2336
                bg_grad_dir: VER
                border_width: 0
                pad_all: 0
                clickable: false
                widgets:
                  - label:
                      align: CENTER
                      text: "${room_icon}"
                      text_font: icons_24
                      text_color: 0xF6C9A0
            - label:
                x: 70
                y: 12
                text: "${room_name}"
                text_font: font_22
                text_color: 0xEEF2F8
            - label:
                x: 70
                y: 38
                text: "${room_subtitle}"
                text_font: font_12
                text_color: 0x8892A8
            - label:
                id: clock_label
                align: TOP_RIGHT
                x: -18
                y: 9
                text: "--:--"
                text_font: font_22
                text_color: 0xEEF2F8
            - label:
                id: offline_indicator
                align: TOP_RIGHT
                x: -86
                y: 14
                text: "\U000F0164"
                text_font: icons_14
                text_color: 0xFF5252
                hidden: true
            - obj:
                align: TOP_RIGHT
                x: -18
                y: 37
                width: SIZE_CONTENT
                height: 18
                styles: box
                clickable: false
                layout:
                  type: flex
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  pad_column: 3
                widgets:
                  - label: { text: "\U000F050F", text_font: icons_14, text_color: 0x8892A8 }
                  - label: { id: chip_temp, text: "--°", text_font: font_12, text_color: 0x8892A8, pad_right: 7 }
                  - label: { text: "\U000F058E", text_font: icons_14, text_color: 0x8892A8 }
                  - label: { id: chip_humidity, text: "-- %", text_font: font_12, text_color: 0x8892A8, pad_right: 7 }
                  - label: { text: "\U000F0595", text_font: icons_14, text_color: 0x8892A8 }
                  - label: { id: chip_outdoor, text: "--°", text_font: font_12, text_color: 0x8892A8 }

      # --- Navigation ---
      - obj:
          id: nav_bar
          x: 12
          y: 410
          width: 456
          height: 58
          radius: 29
          bg_color: 0x182031
          bg_opa: 92%
          border_width: 1
          border_color: 0x2C3650
          pad_all: 0
          scrollable: false
          widgets:
            - obj:
                id: nav_indicator
                x: 5
                y: 5
                width: ${106 if (tabs | default(3)) == 4 else 144}
                height: 46
                radius: 23
                bg_color: 0x222B3E
                border_width: 1
                border_color: 0xFFB547
                border_opa: 35%
                shadow_width: 18
                shadow_spread: -4
                shadow_opa: 30%
                shadow_color: 0xFFB547
                clickable: false
            - button:
                id: nav_btn_0
                x: ${5 + 0 * (112 if (tabs | default(3)) == 4 else 149)}
                y: 5
                width: ${106 if (tabs | default(3)) == 4 else 144}
                height: 46
                radius: 23
                bg_opa: TRANSP
                text_color: 0xFFB547
                pad_left: 0
                pad_right: 0
                layout:
                  type: flex
                  flex_flow: ROW
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                  pad_column: 6
                widgets:
                  - label: { text: "\U000F0335", text_font: icons_22 }
                  - label: { text: "Licht", text_font: font_13 }
                on_click:
                  - if:
                      condition:
                        lambda: "return panel::page > 0;"
                      then:
                        - lvgl.page.show:
                            id: page_lights
                            animation: MOVE_RIGHT
                            time: 300ms
                      else:
                        - lvgl.page.show:
                            id: page_lights
                            animation: MOVE_LEFT
                            time: 300ms
                  - lambda: panel::nav_go(0);
            - button:
                id: nav_btn_1
                x: ${5 + 1 * (112 if (tabs | default(3)) == 4 else 149)}
                y: 5
                width: ${106 if (tabs | default(3)) == 4 else 144}
                height: 46
                radius: 23
                bg_opa: TRANSP
                text_color: 0x8892A8
                pad_left: 0
                pad_right: 0
                layout:
                  type: flex
                  flex_flow: ROW
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                  pad_column: 6
                widgets:
                  - label: { text: "\U000F111C", text_font: icons_22 }
                  - label: { text: "Rollläden", text_font: font_13 }
                on_click:
                  - if:
                      condition:
                        lambda: "return panel::page > 1;"
                      then:
                        - lvgl.page.show:
                            id: page_covers
                            animation: MOVE_RIGHT
                            time: 300ms
                      else:
                        - lvgl.page.show:
                            id: page_covers
                            animation: MOVE_LEFT
                            time: 300ms
                  - lambda: panel::nav_go(1);
            - button:
                id: nav_btn_2
                x: ${5 + 2 * (112 if (tabs | default(3)) == 4 else 149)}
                y: 5
                width: ${106 if (tabs | default(3)) == 4 else 144}
                height: 46
                radius: 23
                bg_opa: TRANSP
                text_color: 0x8892A8
                pad_left: 0
                pad_right: 0
                layout:
                  type: flex
                  flex_flow: ROW
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                  pad_column: 6
                widgets:
                  - label: { text: "${climate_tab_icon | default('\U000F001B')}", text_font: icons_22 }
                  - label: { text: "${climate_tab_text | default('Klima')}", text_font: font_13 }
                on_click:
                  - if:
                      condition:
                        lambda: "return panel::page > 2;"
                      then:
                        - lvgl.page.show:
                            id: page_climate
                            animation: MOVE_RIGHT
                            time: 300ms
                      else:
                        - lvgl.page.show:
                            id: page_climate
                            animation: MOVE_LEFT
                            time: 300ms
                  - lambda: panel::nav_go(2);
            - button:
                id: nav_btn_3
                x: ${5 + 3 * (112 if (tabs | default(3)) == 4 else 149)}
                y: 5
                width: ${106 if (tabs | default(3)) == 4 else 144}
                height: 46
                radius: 23
                bg_opa: TRANSP
                text_color: 0x8892A8
                pad_left: 0
                pad_right: 0
                hidden: ${'false' if (tabs | default(3)) == 4 else 'true'}
                layout:
                  type: flex
                  flex_flow: ROW
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  flex_align_track: CENTER
                  pad_column: 6
                widgets:
                  - label: { text: "${heating_tab_icon | default('\U000F0438')}", text_font: icons_22 }
                  - label: { text: "${heating_tab_text | default('Heizung')}", text_font: font_13 }
                on_click:
                  - if:
                      condition:
                        lambda: "return panel::page > 3;"
                      then:
                        - lvgl.page.show:
                            id: page_heating
                            animation: MOVE_RIGHT
                            time: 300ms
                      else:
                        - lvgl.page.show:
                            id: page_heating
                            animation: MOVE_LEFT
                            time: 300ms
                  - lambda: panel::nav_go(3);

      # --- Erste Berührung nach dem Abdunkeln: nur aufwecken ---
      - obj:
          id: wake_catcher
          x: 0
          y: 0
          width: 480
          height: 480
          styles: box
          hidden: true
          on_press:
            - script.execute: wake_up

      # --- Ruhemodus ---
      - obj:
          id: sleep_overlay
          x: 0
          y: 0
          width: 480
          height: 480
          radius: 0
          border_width: 0
          bg_color: 0x0D1322
          bg_grad_color: 0x03050A
          bg_grad_dir: VER
          hidden: true
          scrollable: false
          on_press:
            - script.execute: wake_up
          widgets:
            - label:
                id: sleep_clock
                align: CENTER
                y: -50
                text: "--:--"
                text_font: font_110
                text_color: 0xDCE3F0
            - label:
                id: sleep_date
                align: CENTER
                y: 22
                text: ""
                text_font: font_17
                text_color: 0x8892A8
            - obj:
                align: CENTER
                y: 72
                width: SIZE_CONTENT
                height: 24
                styles: box
                clickable: false
                layout:
                  type: flex
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  pad_column: 6
                widgets:
                  - label: { text: "\U000F050F", text_font: icons_18, text_color: 0xB9C2D4 }
                  - label: { id: sleep_temp, text: "--°", text_font: font_17, text_color: 0xB9C2D4, pad_right: 16 }
                  - label: { text: "\U000F0595", text_font: icons_18, text_color: 0xB9C2D4 }
                  - label: { id: sleep_outdoor, text: "--°", text_font: font_17, text_color: 0xB9C2D4, pad_right: 16 }
                  - label: { text: "\U000F0335", text_font: icons_18, text_color: 0xB9C2D4 }
                  - label: { id: sleep_lights, text: "", text_font: font_17, text_color: 0xB9C2D4 }
            - label:
                align: BOTTOM_MID
                y: -22
                text: "Tippen zum Aufwecken"
                text_font: font_12
                text_color: 0x5C667C

      # --- Ladebildschirm bis Home Assistant verbunden ist ---
      - obj:
          id: loading_overlay
          x: 0
          y: 0
          width: 480
          height: 480
          radius: 0
          border_width: 0
          bg_color: 0x0A0E16
          scrollable: false
          widgets:
            - label:
                align: CENTER
                y: -70
                text: "${room_icon}"
                text_font: icons_40
                text_color: 0xF6C9A0
            - label:
                align: CENTER
                y: -22
                text: "${room_name}"
                text_font: font_22
                text_color: 0xEEF2F8
            - label:
                id: loading_status
                align: CENTER
                y: 10
                text: "Verbinde mit Home Assistant …"
                text_font: font_13
                text_color: 0x8892A8
            - spinner:
                align: CENTER
                y: 70
                width: 40
                height: 40
                spin_time: 1.2s
                arc_length: 90deg
                arc_width: 4
                arc_color: 0x222B3E
                indicator:
                  arc_color: 0xFFB547
                  arc_width: 4

  # ------------------------------------------------------------------
  # Seiten (Inhalt kommt aus tiles/)
  # ------------------------------------------------------------------
  pages:
    - id: page_lights
      styles: page_style
      scrollable: false
      layout:
        type: flex
        flex_flow: ROW_WRAP
      widgets:
        - obj:
            width: 452
            height: 36
            styles: box
            scrollable: false
            clickable: false
            widgets:
              - obj:
                  align: LEFT_MID
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: box
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    pad_column: 0
                  widgets:
                    - label: { id: light_count_num, text: "0", text_font: font_14b, text_color: 0xFFB547 }
                    - label: { id: light_count_text, text: " von 0 an", text_font: font_14, text_color: 0x8892A8 }
              - button:
                  id: lights_all_off
                  align: RIGHT_MID
                  styles: pill
                  width: SIZE_CONTENT
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                  widgets:
                    - label: { text: "\U000F12CD", text_font: icons_18 }
                    - label: { text: "Alle aus" }
                  on_click:
                    - lambda: |-
                        for (auto &it : panel::lights)
                          panel::light_set(it.first, false);
                    - homeassistant.action:
                        action: homeassistant.turn_off
                        data:
                          entity_id: "${all_lights}"

    - id: page_covers
      styles: page_style
      scrollable: false
      layout:
        type: flex
        flex_flow: ROW_WRAP
      widgets:
        - obj:
            width: 452
            height: 36
            styles: box
            scrollable: false
            clickable: false
            widgets:
              - obj:
                  align: LEFT_MID
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: box
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    pad_column: 0
                  widgets:
                    - label: { id: cover_count_num, text: "--", text_font: font_14b, text_color: 0x5CC8FF }
                    - label: { id: cover_count_text, text: " offen im Schnitt", text_font: font_14, text_color: 0x8892A8 }
              - obj:
                  align: RIGHT_MID
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: box
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    pad_column: 8
                  widgets:
                    - button:
                        styles: pill
                        width: SIZE_CONTENT
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_cross: CENTER
                          flex_align_track: CENTER
                        widgets:
                          - label: { text: "\U000F0795", text_font: icons_18 }
                          - label: { text: "Alle" }
                        on_click:
                          - lambda: |-
                              for (auto &it : panel::covers)
                                panel::cover_command(it.first, 1);
                          - homeassistant.action:
                              action: cover.open_cover
                              data:
                                entity_id: "${all_covers}"
                    - button:
                        styles: pill
                        width: SIZE_CONTENT
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_cross: CENTER
                          flex_align_track: CENTER
                        widgets:
                          - label: { text: "\U000F0792", text_font: icons_18 }
                          - label: { text: "Alle" }
                        on_click:
                          - lambda: |-
                              for (auto &it : panel::covers)
                                panel::cover_command(it.first, -1);
                          - homeassistant.action:
                              action: cover.close_cover
                              data:
                                entity_id: "${all_covers}"

    - id: page_climate
      styles: page_style
      pad_left: 0
      pad_right: 0
      scrollable: false

    # Vierter Reiter (nur mit tabs: 4 sichtbar), z. B. Heizung neben Klima
    - id: page_heating
      styles: page_style
      pad_left: 0
      pad_right: 0
      scrollable: false

  # Abdunkeln nach 1 min, Ruhemodus nach 3 min ohne Berührung
  on_idle:
    - timeout: 60s
      then:
        - lvgl.widget.show: wake_catcher
        - light.turn_on:
            id: display_backlight
            brightness: 40%
    - timeout: 180s
      then:
        - script.execute: update_clock
        - lvgl.widget.show: sleep_overlay
        - lambda: lv_obj_fade_in(id(sleep_overlay), 700, 0);
        - light.turn_on:
            id: display_backlight
            brightness: !lambda |-
              auto t = id(ha_time).now();
              bool night = t.is_valid() && (t.hour >= 21 || t.hour < 7);
              return night ? 0.06f : 0.25f;
