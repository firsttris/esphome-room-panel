# Vorübergehend: Test-Schalter in Home Assistant, um auf dem Gerät zu messen,
# welcher Effekt beim Lichtschalten Zeit kostet (FPS-Zeile oben bzw. im Log).

switch:
  - platform: template
    name: "Test Ripple"
    icon: mdi:test-tube
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: panel::dbg_ripple = true; panel::dbg_apply();
    turn_off_action:
      - lambda: panel::dbg_ripple = false; panel::dbg_apply();
  - platform: template
    name: "Test Eindrücken"
    icon: mdi:test-tube
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: panel::dbg_press = true; panel::dbg_apply();
    turn_off_action:
      - lambda: panel::dbg_press = false; panel::dbg_apply();
  - platform: template
    name: "Test Abgerundeter Zuschnitt"
    icon: mdi:test-tube
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: panel::dbg_clip = true; panel::dbg_apply();
    turn_off_action:
      - lambda: panel::dbg_clip = false; panel::dbg_apply();
  - platform: template
    name: "Test Lichtschein"
    icon: mdi:test-tube
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: panel::dbg_glow = true; panel::dbg_apply();
    turn_off_action:
      - lambda: panel::dbg_glow = false; panel::dbg_apply();
