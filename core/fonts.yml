# Schriften und Icons
#
# Outfit (Google Fonts) für Text und Zahlen, Material Design Icons für Symbole.
# bpp: 4 = Kantenglättung mit 16 Stufen (ohne wirken Schrift und Icons treppig).
# Jedes Icon, das ein Raum benutzt, muss hier in der passenden Größe stehen,
# sonst bleibt es leer. Codepoints: https://pictogrammers.com/library/mdi/

font:
  - file: { type: gfonts, family: Outfit, weight: 400 }
    id: font_12
    bpp: 4
    size: 12
    glyphs: &latin " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°²³ÄÖÜäöüß·…✓Ø"

  - file: { type: gfonts, family: Outfit, weight: 500 }
    id: font_13
    bpp: 4
    size: 13
    glyphs: *latin

  - file: { type: gfonts, family: Outfit, weight: 500 }
    id: font_14
    bpp: 4
    size: 14
    glyphs: *latin

  - file: { type: gfonts, family: Outfit, weight: 600 }
    id: font_14b
    bpp: 4
    size: 14
    glyphs: *latin

  - file: { type: gfonts, family: Outfit, weight: 600 }
    id: font_19
    bpp: 4
    size: 19
    glyphs: *latin

  - file: { type: gfonts, family: Outfit, weight: 600 }
    id: font_20
    bpp: 4
    size: 20
    glyphs: *latin

  - file: { type: gfonts, family: Outfit, weight: 600 }
    id: font_22
    bpp: 4
    size: 22
    glyphs: *latin

  - file: { type: gfonts, family: Outfit, weight: 400 }
    id: font_17
    bpp: 4
    size: 17
    glyphs: *latin

  # Solltemperatur im Drehregler
  - file: { type: gfonts, family: Outfit, weight: 600 }
    id: font_54
    bpp: 4
    size: 54
    glyphs: "0123456789,.-°"

  - file: { type: gfonts, family: Outfit, weight: 400 }
    id: font_26
    bpp: 4
    size: 26
    glyphs: "°"

  # Uhr im Ruhemodus
  - file: { type: gfonts, family: Outfit, weight: 300 }
    id: font_110
    bpp: 4
    size: 110
    glyphs: "0123456789:-"

